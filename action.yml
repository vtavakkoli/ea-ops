name: EA-Ops Architecture Gate
description: Validate an EA-Ops repository in GitHub Actions.
inputs:
  root:
    description: Path to the EA-Ops architecture repository.
    required: false
    default: .
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with: {python-version: '3.12'}
    - shell: bash
      env:
        EAOPS_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install "$EAOPS_ACTION_PATH"
    - shell: bash
      run: eaops validate "${{ inputs.root }}"
branding:
  icon: git-pull-request
  color: blue
