name: EA-Ops CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: eaops validate examples/sample-enterprise
      - run: eaops report examples/sample-enterprise --output reports/sample-architecture-report.md
      - run: eaops build examples/sample-enterprise --output site
