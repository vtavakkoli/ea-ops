name: IEEE Research Evaluation

on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: Measured repetitions per scalability size
        required: false
        default: "30"
      build_repetitions:
        description: Report/portal build repetitions per size
        required: false
        default: "3"
  push:
    tags:
      - "research-*"

permissions:
  contents: write

concurrency:
  group: research-evaluation-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  RESEARCH_REPETITIONS: ${{ github.event.inputs.repetitions || '30' }}
  BUILD_REPETITIONS: ${{ github.event.inputs.build_repetitions || '3' }}

jobs:
  performance:
    name: Scale ${{ matrix.objects }} objects
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        objects: [100, 1000, 10000, 50000, 100000]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache ArchiMate relationship matrix
        uses: actions/cache@v4
        with:
          path: ~/.cache/ea-ops
          key: archimate-3.2-5ec8c5f52a1de982f93838a28dcf1766c5e4f7ca
      - name: Install EA-Ops
        run: python -m pip install -e .
      - name: Generate deterministic architecture
        run: |
          python benchmarks/generate_model.py             --objects ${{ matrix.objects }}             --seed 42             --output generated/model-${{ matrix.objects }}
      - name: Record runner environment
        run: python benchmarks/environment.py --output results/raw/environment-${{ matrix.objects }}.json
      - name: Run performance experiment
        run: |
          python benchmarks/benchmark.py             --model generated/model-${{ matrix.objects }}             --warmups 3             --repetitions "$RESEARCH_REPETITIONS"             --build-repetitions "$BUILD_REPETITIONS"             --output results/raw/performance-${{ matrix.objects }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: performance-${{ matrix.objects }}
          path: results/raw/
          retention-days: 90

  accuracy:
    name: Fault ${{ matrix.fault }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        fault:
          - dangling_source
          - dangling_target
          - invalid_archimate_relationship
          - missing_owner
          - missing_criticality
          - duplicate_id
          - invalid_lifecycle
          - governance_violation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache ArchiMate relationship matrix
        uses: actions/cache@v4
        with:
          path: ~/.cache/ea-ops
          key: archimate-3.2-5ec8c5f52a1de982f93838a28dcf1766c5e4f7ca
      - name: Install EA-Ops
        run: python -m pip install -e .
      - name: Generate 30 independent fault trials
        shell: bash
        run: |
          set -euo pipefail
          for seed in $(seq 1 30); do
            trial=$(printf "%02d" "$seed")
            python benchmarks/generate_model.py --objects 100 --seed "$seed" --output "generated/clean-${trial}"
            python benchmarks/inject_faults.py               --model "generated/clean-${trial}"               --fault "${{ matrix.fault }}"               --output "generated/faults/${{ matrix.fault }}/trial-${trial}"
          done
      - name: Evaluate precision recall and F1
        run: |
          python benchmarks/evaluate_accuracy.py             --root "generated/faults/${{ matrix.fault }}"             --minimum-f1 0.99             --output "results/raw/accuracy-${{ matrix.fault }}.csv"
      - uses: actions/upload-artifact@v4
        with:
          name: accuracy-${{ matrix.fault }}
          path: results/raw/
          retention-days: 90

  aggregate:
    name: Publication tables and figures
    runs-on: ubuntu-latest
    needs: [performance, accuracy]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research plotting dependencies
        run: python -m pip install -r benchmarks/requirements-research.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: performance-*
          path: results/raw/
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: accuracy-*
          path: results/raw/
          merge-multiple: true
      - name: Aggregate tables and figures
        run: python benchmarks/aggregate.py --input results/raw --output results
      - name: Build reproducibility bundle
        run: |
          cp CITATION.cff results/
          cp benchmarks/README.md results/METHODOLOGY.md
          tar -czf ea-ops-research-results.tar.gz results/
      - uses: actions/upload-artifact@v4
        with:
          name: ieee-evaluation-results
          path: |
            results/
            ea-ops-research-results.tar.gz
          retention-days: 90
      - name: Attach results to research release
        if: startsWith(github.ref, 'refs/tags/research-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}"               --title "EA-Ops research artifact ${GITHUB_REF_NAME}"               --notes "Reproducible evaluation artifact generated by the IEEE Research Evaluation workflow."
          fi
          gh release upload "${GITHUB_REF_NAME}" ea-ops-research-results.tar.gz --clobber
